[package]
name = "bug-bench-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "service"
path = "service.rs"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
rand = "0.8"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
